<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Orarise</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/orarise-marque.png">
<style>
  :root{--ink:#0B0A10;--dawn1:#F0A93B;--dawn2:#FFCE6B;--muted:#9A8F86}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--ink);color:#F5EFE6;min-height:100vh;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
    background-image:radial-gradient(700px 400px at 50% 0%, rgba(240,169,59,0.18), transparent 60%);
  }
  .box{max-width:460px}
  img{width:56px;height:56px;border-radius:14px;margin-bottom:24px}
  .code{font-size:14px;font-weight:700;letter-spacing:2px;color:var(--dawn2);margin-bottom:12px}
  h1{font-size:30px;line-height:1.2;margin-bottom:14px}
  p{color:var(--muted);line-height:1.6;margin-bottom:28px}
  a{
    display:inline-block;background:linear-gradient(135deg,var(--dawn1),var(--dawn2));
    color:var(--ink);font-weight:700;padding:14px 26px;border-radius:14px;text-decoration:none;
  }
  a:hover{transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="box">
    <img src="/orarise-marque.png" alt="">
    <div class="code">ERREUR 404</div>
    <h1>Cette page dort encore.</h1>
    <p>Le lien est peut-être erroné, ou la page n'existe plus. Le reste d'Orarise, lui, est bien réveillé.</p>
    <a href="/">Retour à l'accueil</a>
  </div>
</body>
</html>
