<script>
/* ── À LIRE AVANT DE TOUCHER À CE BLOC ────────────────────────────────
   Cette ligne doit rester DANS LE <head>, avant tout rendu.
 
   Le script d'animation est en bas de page. S'il posait lui-même le
   masquage, le navigateur aurait déjà peint le hero visible : on
   verrait le titre et le téléphone apparaître, disparaître, puis
   revenir. C'est exactement le clignotement qu'on a chassé deux fois.
 
   Le filet de sécurité compte autant : si le script du bas ne s'exécute
   jamais — erreur JavaScript, extension bloquante, fichier tronqué — on
   retire le masquage au bout de deux secondes. Mieux vaut une page sans
   animation qu'une page blanche que personne ne viendra signaler.    */
(function(){
  var h = document.documentElement;
  h.className += ' js-anim';
  setTimeout(function(){
    if(!h.hasAttribute('data-anim-prete')){
      h.className = h.className.replace(' js-anim','');
    }
  }, 2000);
})();
</script>
